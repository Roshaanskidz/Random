<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pin2Sticker</title>
  <meta name="description" content="Pin2Sticker is a personal image organization utility for Pinterest content.">
  <style>
    body{margin:0;background:#0b0b10;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:760px;margin:0 auto;padding:80px 24px;text-align:center}
    .icon{width:110px;height:110px;border-radius:28px;margin:0 auto 28px;background:linear-gradient(145deg,#ff315c,#7b2cff);display:grid;place-items:center;font-size:52px;box-shadow:0 20px 60px #0008}
    h1{font-size:46px;margin:0 0 14px} p{color:#b8b8c2;font-size:18px;line-height:1.6}
    a{color:#fff;text-decoration:none;border-bottom:1px solid #777}
    .card{margin-top:42px;padding:24px;border:1px solid #292933;border-radius:18px;background:#12121a}
    footer{margin-top:50px;color:#777;font-size:14px}
  </style>
</head>
<body>
<main>
  <div class="icon">↓</div>
  <h1>Pin2Sticker</h1>
  <p>A simple utility for finding and organizing image Pins for personal use.</p>
  <div class="card">
    <p>Pin2Sticker is not affiliated with or endorsed by Pinterest.</p>
    <p><a href="/privacy.html">Privacy Policy</a></p>
  </div>
  <footer>© 2026 Pin2Sticker</footer>
</main>
</body>
</html>
